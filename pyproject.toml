[project]
name = "standard-ai"
version = "0.1.0"
description = "AI-powered Intelligent Assistant for Indian Standards and BIS Services (SIH26107)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Team Manak Mitra" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.1",
    "numpy>=1.26.4",
    "requests>=2.32.3",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "playwright>=1.46.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/app"]
asyncio_mode = "auto"